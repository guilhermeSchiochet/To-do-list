name: to_do_list
description: A task manager with local storage, for Android and Windows.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.2.6
  lucide_icons: ^0.257.0
  shared_preferences: ^2.2.1
  animations: ^2.0.11
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol
  intl: ^0.20.2
  device_preview: ^1.3.1
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Só gera os ícones das plataformas; não vai junto no app.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/json/
